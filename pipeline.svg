<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <style>
      .box{fill:#0d1117;stroke:url(#g);stroke-width:2.5;rx:14}
      .t{fill:#e6edf3;font:600 15px 'Segoe UI',Arial,sans-serif;text-anchor:middle}
      .s{fill:#8b949e;font:12px 'Segoe UI',Arial,sans-serif;text-anchor:middle}
      .line{stroke:#30363d;stroke-width:2;stroke-dasharray:6 6;animation:dash 1s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-12}}
      .pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes pulse{0%,100%{opacity:.75}50%{opacity:1;}}
      .d1{animation-delay:0s}.d2{animation-delay:.6s}.d3{animation-delay:1.2s}.d4{animation-delay:1.8s}.d5{animation-delay:2.4s}
    </style>
  </defs>
  <rect width="900" height="260" fill="#0b0f14" rx="16"/>
  <!-- connectors -->
  <line class="line" x1="150" y1="130" x2="195" y2="130"/>
  <line class="line" x1="335" y1="130" x2="380" y2="130"/>
  <line class="line" x1="520" y1="130" x2="565" y2="130"/>
  <line class="line" x1="705" y1="130" x2="750" y2="130"/>
  <!-- boxes -->
  <g class="pulse d1"><rect class="box" x="20" y="85" width="130" height="90"/><text class="t" x="85" y="125">❓ Question</text><text class="s" x="85" y="147">Streamlit input</text></g>
  <g class="pulse d2"><rect class="box" x="195" y="85" width="140" height="90"/><text class="t" x="265" y="125">🧮 Embed</text><text class="s" x="265" y="147">MiniLM-L6-v2</text></g>
  <g class="pulse d3"><rect class="box" x="380" y="85" width="140" height="90"/><text class="t" x="450" y="125">🔎 Retrieve</text><text class="s" x="450" y="147">Chroma · top-2</text></g>
  <g class="pulse d4"><rect class="box" x="565" y="85" width="140" height="90"/><text class="t" x="635" y="125">🦙 Generate</text><text class="s" x="635" y="147">Ollama llama3.2:3b</text></g>
  <g class="pulse d5"><rect class="box" x="750" y="85" width="130" height="90"/><text class="t" x="815" y="125">🤖 Answer</text><text class="s" x="815" y="147">Shown in UI</text></g>
  <!-- travelling dot -->
  <circle r="7" fill="#f0abfc">
    <animateMotion dur="5s" repeatCount="indefinite" path="M85,130 L815,130"/>
    <animate attributeName="opacity" values="0;1;1;1;0" dur="5s" repeatCount="indefinite"/>
  </circle>
  <text class="s" x="450" y="235">Retrieval-Augmented Generation — runs 100% locally</text>
</svg>
